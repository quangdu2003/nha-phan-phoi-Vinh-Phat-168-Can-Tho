<link rel="icon" href="./favicon.png">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
    width:100%; height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#202124;
}
.viewer { display:flex; width:100%; height:100vh; }

/* ═══ SIDEBAR ═══════════════════════════════════════════════════════ */
.sidebar {
    width:200px;
    background:#2b2b2b;
    overflow-y:auto;
    overflow-x:hidden;
    border-right:1px solid #3c4043;
    padding:12px 8px;
    display:flex;
    flex-direction:column;
    height:100vh;
    flex-shrink:0;
}
.thumb {
    width:100%;
    margin-bottom:14px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.thumb-inner {
    width:100%;
    aspect-ratio:210/297;
    background:#fff;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}
.thumb-inner img {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}
.thumb span {
    display:block;
    text-align:center;
    color:#bbb;
    margin-top:4px;
    font-size:12px;
}
.thumb:hover .thumb-inner { outline:2px solid #8ab4f8; }

/* ═══ MAIN ═════════════════════════════════════════════════════════ */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:#1e1e1e; }

/* ═══ TOOLBAR ═══════════════════════════════════════════════════════ */
.toolbar {
    height:52px;
    background:#2b2b2b;
    border-bottom:1px solid #3c4043;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:0 14px;
    flex-shrink:0;
    gap:8px;
}
.toolbar-title {
    color:#fff; font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; justify-self:start;
}
.toolbar-center { display:flex; align-items:center; justify-content:center; }
.zoom-btn {
    width:32px; height:32px; border:none; background:#3c4043; color:#fff;
    cursor:pointer; border-radius:4px; font-size:22px; font-weight:300;
    display:flex; align-items:center; justify-content:center; user-select:none;
}
.zoom-btn:hover { background:#5f6368; }
.zoom-val {
    width:60px; height:28px; background:#202124; border:1px solid #5f6368; color:#fff;
    text-align:center; font-size:13px; outline:none; border-radius:3px; margin:0 4px;
}
.toolbar-right { display:flex; align-items:center; gap:8px; justify-self:end; }
.tool-btn {
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    border-radius:4px; background:#3c4043; cursor:pointer; border:none; text-decoration:none;
}
.tool-btn:hover { background:#4f5256; }
.tool-btn svg { width:20px; height:20px; fill:#fff; }

/* ═══ CONTENT ═══════════════════════════════════════════════════════ */
.content {
    flex:1; overflow-x:hidden; overflow-y:auto; padding:24px 0; scroll-behavior:smooth;
}
.page {
    width:794px; height:1123px; background:#fff;
    margin:0 auto 24px; overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.6); position:relative; flex-shrink:0;
}
.page > img { width:100%; height:100%; display:block; object-fit:fill; }

/* ═══ MOBILE ════════════════════════════════════════════════════════ */
@media (max-width:768px) {
    .sidebar { display:none; }
    .toolbar {
        height:auto; display:flex; flex-direction:column;
        align-items:stretch; padding:8px 10px; gap:0;
    }
    .toolbar-title {
        width:100%; text-align:center; font-size:13px;
        padding-bottom:8px; border-bottom:1px solid #3c4043;
    }
    .toolbar-center, .toolbar-right { display:none !important; }
    .page { width:95vw !important; height:auto !important; aspect-ratio:210/297; }
}

/* ═══ MOBILE TOOLBAR ROW 2 ══════════════════════════════════════════ */
#toolbar-row2 {
    display:none;
    background:#2b2b2b;
    border-bottom:1px solid #3c4043;
    height:50px;
    padding:0 12px;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
}
#toolbar-row2 .mob-zoom {
    display:flex;
    align-items:center;
    gap:4px;
}
#toolbar-row2 .zoom-btn {
    width:36px; height:36px; font-size:24px;
}
#toolbar-row2 .zoom-val {
    width:56px; height:30px; font-size:13px;
}

/* ═══ PRINT (Desktop) ═══════════════════════════ */
@media print {
    @page { size:A4 portrait; margin:0; }
    .sidebar, .toolbar, #toolbar-row2 { display:none !important; }
    html, body, .viewer, .main, .content {
        background:white !important; width:210mm !important; height:auto !important;
        overflow:visible !important; margin:0 !important; padding:0 !important;
    }
    .page {
        display:block !important; width:210mm !important; height:297mm !important;
        margin:0 !important; border:none !important; box-shadow:none !important;
        page-break-after:always !important; break-after:page !important;
    }
    .page > img { width:210mm !important; height:297mm !important; object-fit:fill !important; }
}
</style>

<script>
function applyLayout() {
    const mob = window.innerWidth <= 768;
    document.getElementById('toolbar-row2').style.display = mob ? 'flex' : 'none';
}
applyLayout();
window.addEventListener('resize', applyLayout);

let zoomLevel = 100;
const contentEl = document.getElementById('content');

function updateZoom() {
    document.querySelectorAll('.page').forEach(p => {
        p.style.transformOrigin = 'top center';
        p.style.transform = `scale(${zoomLevel/100})`;
        const h = p.offsetHeight;
        const diff = h - h * zoomLevel / 100;
        p.style.marginTop = `${-diff/2}px`;
        p.style.marginBottom = `${24 - diff/2}px`;
    });
    const val = zoomLevel + '%';
    document.getElementById('zoom-display').value = val;
    document.getElementById('zoom-display-mob').value = val;
}
function zoomIn()  { if (zoomLevel < 200) { zoomLevel += 10; updateZoom(); } }
function zoomOut() { if (zoomLevel > 30)  { zoomLevel -= 10; updateZoom(); } }

function scrollToPage(i) {
    const el = document.getElementById('p' + i);
    if (el) contentEl.scrollTo({ top: el.offsetTop - 16, behavior: 'smooth' });
}

window.addEventListener('beforeprint', () => {
    document.querySelectorAll('.page').forEach(p => {
        p.style.transform = p.style.marginTop = p.style.marginBottom = '';
    });
});
</script>
